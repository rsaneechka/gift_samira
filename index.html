<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3ea">
<title>Наши моменты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root { --bg:#fff3ea; --pink:#f4a6b8; --pink-d:#d9617f; --ink:#5a3a43; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Press Start 2P', ui-monospace, monospace; overflow:hidden; }

  /* Полноэкранные экраны поверх AR */
  .screen { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px; padding:32px; text-align:center;
    background:var(--bg); }
  .screen[hidden] { display:none; }
  .screen h1 { font-size:18px; line-height:1.7; margin:0; }
  .screen p  { font-size:11px; line-height:2; margin:0; max-width:320px; }
  .screen ol { font-size:10px; line-height:2; text-align:left; max-width:320px; padding-left:20px; margin:0; }
  .heart { font-size:44px; animation:beat 1.2s infinite; }
  @keyframes beat { 50% { transform:scale(1.15); } }

  button { font:inherit; font-size:13px; color:#fff; background:var(--pink-d); border:0;
    padding:18px 26px; box-shadow:0 4px 0 #a8435e; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #a8435e; }

  /* Подсказка сверху */
  #hint { position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:50%; transform:translateX(-50%);
    z-index:5; font-size:10px; padding:10px 14px; background:rgba(255,243,234,.85); color:var(--ink);
    border:2px solid var(--pink); white-space:nowrap; transition:opacity .4s; pointer-events:none; }
  #hint.off { opacity:0; }

  a-scene { position:fixed !important; inset:0; }
  #stage { position:fixed; inset:0; visibility:hidden; }
  #stage.on { visibility:visible; }
</style>
</head>
<body>

<!-- Стартовый экран -->
<div id="start" class="screen">
  <div class="heart">❤️</div>
  <h1>Для тебя</h1>
  <p>Нажми и наведи камеру на фото в книге</p>
  <button id="go">Начать</button>
</div>

<!-- Загрузка -->
<div id="loading" class="screen" hidden>
  <div class="heart">💗</div>
  <p>Включаю камеру…</p>
</div>

<!-- Ошибка камеры / прочее -->
<div id="error" class="screen" hidden>
  <h1 id="err-title">Нет доступа к камере</h1>
  <p id="err-text">Камера нужна, чтобы фото ожили.</p>
  <ol id="err-steps"></ol>
  <button id="retry">Попробовать снова</button>
</div>

<div id="hint" class="off">наведи камеру на фотографию</div>
<div id="stage"></div>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
// ===== Настройки =====
const COUNT   = 5;             // сколько фоток (01..NN)
const ASPECT  = 4 / 3;         // высота/ширина фото (вертикальные 3:4)
const ASPECTS = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1 };  // исключения: квадратные фото
const VIDEO_DIR = './videos_web/';
const TARGETS   = './targets.mind';

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// Один общий <video> на все метки: звук разрешается одним тапом,
// и одновременно физически не может играть больше одного ролика.
const video = document.createElement('video');
video.id = 'vid';
video.setAttribute('playsinline', '');
video.setAttribute('webkit-playsinline', '');
video.preload = 'metadata';
video.loop = true;
video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
document.body.appendChild(video);

let current = -1;     // индекс активной метки
let fadeRaf = 0;

function show(id) {
  for (const s of ['start', 'loading', 'error']) $(s).hidden = (s !== id);
}

function showError(kind) {
  const steps = {
    denied: {
      h: 'Нет доступа к камере',
      t: 'Разреши доступ к камере, чтобы фото ожили.',
      s: isIOS
        ? ['Открой Настройки → Safari → Камера', 'Выбери «Спрашивать» или «Разрешить»', 'Вернись сюда и нажми кнопку ниже']
        : ['Нажми на значок замка слева от адреса', 'Разрешения → Камера → Разрешить', 'Обнови страницу и нажми кнопку ниже']
    },
    nocam:  { h: 'Камера не найдена', t: 'Камера не найдена на этом устройстве.', s: ['Открой ссылку на телефоне', 'Закрой другие приложения, которые используют камеру'] },
    https:  { h: 'Нужен https', t: 'Страница должна открываться по https.', s: ['Открой ссылку из QR-кода ещё раз'] },
    targets:{ h: 'Не загрузились данные', t: 'Не удалось загрузить данные для распознавания фото.', s: ['Проверь интернет и обнови страницу'] },
    other:  { h: 'Что-то пошло не так', t: 'Что-то пошло не так.', s: ['Обнови страницу', isIOS ? 'Открой ссылку в Safari' : 'Открой ссылку в Chrome'] }
  }[kind] || {};
  $('err-title').textContent = steps.h || 'Что-то пошло не так';
  $('err-text').textContent = steps.t;
  $('err-steps').innerHTML = (steps.s || []).map(x => `<li>${x}</li>`).join('');
  show('error');
}

// Плавное появление: «оживление» фото
function fade(el, to, ms) {
  cancelAnimationFrame(fadeRaf);
  const from = parseFloat(el.getAttribute('material').opacity) || 0;
  const t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / ms);
    el.setAttribute('material', 'opacity', from + (to - from) * k);
    if (k < 1) fadeRaf = requestAnimationFrame(step);
  })(t0);
}

function buildScene() {
  let planes = '';
  for (let i = 0; i < COUNT; i++) {
    const h = ASPECTS[i + 1] || ASPECT;
    planes += `
      <a-entity mindar-image-target="targetIndex: ${i}" data-i="${i}">
        <a-video src="#vid" width="1" height="${h}" position="0 0 0.001"
                 material="shader: flat; transparent: true; opacity: 0"></a-video>
      </a-entity>`;
  }
  $('stage').innerHTML = `
    <a-scene mindar-image="imageTargetSrc: ${TARGETS}; maxTrack: 1; autoStart: false;
                           uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
             color-space="sRGB" renderer="colorManagement: true; alpha: true"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>
      ${planes}
    </a-scene>`;
  return $('stage').querySelector('a-scene');
}

function wireTargets(scene) {
  scene.querySelectorAll('[mindar-image-target]').forEach(t => {
    const i = +t.dataset.i;
    const plane = t.querySelector('a-video');

    t.addEventListener('targetFound', () => {
      $('hint').classList.add('off');
      // Меняем ролик, только если сменилась метка
      if (current !== i) {
        video.src = `${VIDEO_DIR}${pad(i + 1)}.mp4`;
        video.currentTime = 0;
        plane.setAttribute('material', 'opacity', 0);
      }
      current = i;
      video.muted = false;
      video.play().then(() => {
        // Показываем только когда пошёл кадр, без чёрной вспышки
        const go = () => fade(plane, 1, 700);
        if (video.readyState >= 3) go(); else video.addEventListener('playing', go, { once: true });
      }).catch(() => {
        // Автоплей со звуком отклонён — играем без звука, не ломаем показ
        video.muted = true;
        video.play().then(() => fade(plane, 1, 700)).catch(() => {});
      });
    });

    t.addEventListener('targetLost', () => {
      if (current === i) {
        video.pause();
        plane.setAttribute('material', 'opacity', 0);
        $('hint').classList.remove('off');
      }
    });
  });
}

async function launch() {
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return showError('https');

  // Разблокировка звука: play() внутри жеста пользователя на том же <video>
  video.src = `${VIDEO_DIR}01.mp4`;
  video.muted = false;
  video.play().then(() => video.pause()).catch(() => {});

  show('loading');
  try {
    // Проверяем доступность targets.mind заранее — понятная ошибка вместо чёрного экрана
    const r = await fetch(TARGETS, { method: 'HEAD' });
    if (!r.ok) return showError('targets');

    const old = $('stage').querySelector('a-scene');
    if (old) old.remove();
    const scene = buildScene();
    wireTargets(scene);

    scene.addEventListener('arError', () => showError('denied'));
    await new Promise(res => scene.hasLoaded ? res() : scene.addEventListener('loaded', res, { once: true }));

    await scene.systems['mindar-image-system'].start();
    $('stage').classList.add('on');
    $('hint').classList.remove('off');
    show('none');
  } catch (e) {
    console.error(e);
    const n = (e && (e.name || e.message || '')) + '';
    if (/NotAllowed|Permission|denied/i.test(n)) showError('denied');
    else if (/NotFound|Devices/i.test(n)) showError('nocam');
    else showError('other');
  }
}

$('go').addEventListener('click', launch);
$('retry').addEventListener('click', () => location.reload());
</script>
</body>
</html>
